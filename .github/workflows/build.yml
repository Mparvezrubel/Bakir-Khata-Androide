name: Android CI / Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # AGP 9.1.1 requires Java 21 to run
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Setup Gradle with official action for optimized caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ensure gradlew has correct Unix line endings and execute permissions
      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # Restore debug.keystore from base64 if present, or generate a fresh one
      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      # Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Upload generated APK as artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BakirKhata-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
